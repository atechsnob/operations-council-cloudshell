steps:
  # ── Step 1: Install dependencies and run tests ──────────────────────────────
  - name: "python:3.12"
    id: "test"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install --quiet -r requirements.txt
        echo "▶ Running eval suite (regression guards must pass before deploy)"
        pytest chapter_05_trial_by_fire/test_council.py -v \
          -k "not integration" \
          --tb=short
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "REGION=$_REGION"
      - "GOOGLE_GENAI_USE_VERTEXAI=TRUE"
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"
      - "GOOGLE_CLOUD_LOCATION=$_REGION"
      - "MODEL_PRO=$_MODEL_PRO"
      - "MODEL_FLASH=$_MODEL_FLASH"
      - "BQ_DATASET=$_BQ_DATASET"

  # ── Step 2: Build the Docker image ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/operations-council:$SHORT_SHA"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/operations-council:latest"
      - "."
    waitFor: ["test"]

  # ── Step 3: Push to Artifact Registry ───────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      - "push"
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/operations-council"
    waitFor: ["build"]

  # ── Step 4: Deploy to Cloud Run ─────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "operations-council"
      - "--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/operations-council:$SHORT_SHA"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--service-account=$_SERVICE_ACCOUNT"
      - "--set-env-vars=PROJECT_ID=$PROJECT_ID,REGION=$_REGION,GOOGLE_GENAI_USE_VERTEXAI=TRUE,BQ_DATASET=$_BQ_DATASET"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--concurrency=10"
      - "--min-instances=1"
      - "--max-instances=10"
      - "--no-allow-unauthenticated"
      - "--tag=commit-$SHORT_SHA"
    waitFor: ["push"]

# Substitution defaults (override at trigger time or with --substitutions flag)
substitutions:
  _REGION: us-central1
  _REPO_NAME: operations-council-repo
  _SERVICE_ACCOUNT: operations-council-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _MODEL_PRO: gemini-2.0-pro
  _MODEL_FLASH: gemini-2.0-flash
  _BQ_DATASET: operations_council

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/operations-council:$SHORT_SHA"
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/operations-council:latest"
